{% extends "base_template.html" %}
{% block title %}Clientes{% endblock %}

{% block content %}
<header>
        <nav>
                <a href=""><button>Comprar</button></a>
                <a href="{{ url_for('main') }}"><button>Volver</button></a>
        </nav>
</header>
<main>
        <table>
                <tr>
                        <th>ID</th>
                        <th>CODIGO</th>
                        <th>PRODUCTO</th>
                        <th>PRECIO</th>
                        <th>STATUS</th>
                        <th>ACCIONES</th>
                </tr>
                {% for v in data %}
                <tr>
                        <td>{{ v[0] }}</td>
                        <td>{{ v[1] }}</td>
                        <td>{{ v[2] }}</td>
                        <td>{{ v[3] }}</td>
                        <td>{{ v[4] }}</td>
                        <td><a href=""><button>editar</button></a> | <a href=""><button>Borrar</button><a>
                </tr>
                {% endfor %}
        </table>
</main>
{% endblock %}
